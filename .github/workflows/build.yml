name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch FFmpeg (embedded into Savor.exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest stable FFmpeg 8.x build from BtbN. Pinned below 9.0 on purpose: 9.x builds use NVENC SDK 13.1+,
          # which needs NVIDIA driver 610+, and GTX 10-series (Pascal) cards are capped at the 580 driver branch.
          # 8.x builds use SDK 13.0 (driver 570+), so NVENC keeps working on those cards.
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $stable = $assets | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-[\d.]+\.zip$' } |
            Where-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+).*','$1') -lt [version]'9.0' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+).*','$1') } -Descending
          if (-not $stable) { throw "no FFmpeg 8.x build found" }
          $pick = $stable[0]
          Write-Host "::notice::FFmpeg build: $pick"
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $exe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $filters = (& $exe.FullName -hide_banner -filters) -join "`n"
          Write-Host "::notice::ddagrab=$($filters -match 'ddagrab') scale_d3d11=$($filters -match 'scale_d3d11')"
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $in = [IO.File]::OpenRead($exe.FullName)
          $out = [IO.File]::Create("ffmpeg/ffmpeg.exe.gz")
          $gz = New-Object IO.Compression.GZipStream($out, [IO.Compression.CompressionLevel]::Optimal)
          $in.CopyTo($gz); $gz.Dispose(); $out.Dispose(); $in.Dispose()

      - name: Compile shaders
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter fxc.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          Write-Host "::notice::fxc: $($fxc.FullName)"
          & $fxc.FullName /nologo /T ps_2_0 /E main /O3 /Fo src/Savor/Shaders/ExpandRange.ps src/Savor/Shaders/ExpandRange.hlsl
          if (-not (Test-Path src/Savor/Shaders/ExpandRange.ps)) { throw "shader compile failed" }

      - name: Publish Savor.exe
        run: >
          dotnet publish src/Savor/Savor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false -p:DebugType=none -o publish

      - name: Read version
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length
          $v = ([xml](Get-Content src/Savor/Savor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Savor
          path: publish/Savor.exe

      # Launches the built exe on the runner, records its memory use and a screenshot.
      # Results go to the "ci-diagnostics" pre-release (not shown as an update to users).
      - name: Smoke test (memory + screenshot)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # pre-configure an app audio track so the mixer row shows in the screenshot
          New-Item -ItemType Directory -Force "$env:APPDATA\Savor" | Out-Null
          '{"SeparateAudioTracks":true,"AppTracks":[{"Exe":"explorer.exe","Name":"Windows Explorer","Volume":1.0}]}' | Out-File "$env:APPDATA\Savor\settings.json" -Encoding utf8
          $env:SAVOR_SELFTEST_AUDIO = "1"
          $p = Start-Process publish/Savor.exe -PassThru
          Start-Sleep 40
          $p.Refresh()
          function Mb($b) { [math]::Round($b / 1MB, 1) }
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $kids = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)"
          $kidTxt = ($kids | ForEach-Object { "$($_.Name) $(Mb $_.WorkingSetSize)MB" }) -join ", "
          $line = "Savor: private working set $(Mb $pws) MB, working set $(Mb $p.WorkingSet64) MB, private bytes $(Mb $p.PrivateMemorySize64) MB | children: $kidTxt"
          Write-Host "::notice::$line"
          $line | Out-File diag.txt
          $st0 = "$env:LOCALAPPDATA\Savor\selftest.log"
          if (Test-Path $st0) { $t0 = Get-Content $st0 -Raw; Write-Host "::notice::$t0"; Remove-Item $st0 }
          $env:SAVOR_SELFTEST_AUDIO = $null
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
          $kids | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3

          # second run: open, go to the tray like the X button does, then press Alt+F10 like a real keyboard
          Get-ChildItem "$env:USERPROFILE\Videos\Savor" -Filter "Clip *.mp4" -ErrorAction SilentlyContinue | Remove-Item -Force
          $env:SAVOR_SELFTEST_TRAY = "1"
          $p = Start-Process publish/Savor.exe -PassThru
          Start-Sleep 55
          $p.Refresh()
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $kids = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)"
          $kidTxt = ($kids | ForEach-Object { "$($_.Name) $(Mb $_.WorkingSetSize)MB" }) -join ", "
          $line2 = "In tray: private working set $(Mb $pws) MB, private bytes $(Mb $p.PrivateMemorySize64) MB | children: $kidTxt"
          Write-Host "::notice::$line2"
          $line2 | Out-File diag.txt -Append
          [System.Windows.Forms.SendKeys]::SendWait("%{F10}")
          Start-Sleep 12
          $clips = Get-ChildItem "$env:USERPROFILE\Videos\Savor" -Filter "Clip *.mp4" -ErrorAction SilentlyContinue
          $ffx = Get-ChildItem "$env:LOCALAPPDATA\Savor\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($clips) {
            foreach ($c in $clips) {
              $info = (& $ffx.FullName -hide_banner -i $c.FullName 2>&1) -join " "
              $dur = if ($info -match "Duration: ([0-9:.]+)") { $Matches[1] } else { "?" }
              $l = "TRAY CLIP OK: $($c.Name) $([math]::Round($c.Length/1MB,1)) MB, duration $dur"
              Write-Host "::notice::$l"; $l | Out-File diag.txt -Append
            }
          } else { Write-Host "::warning::TRAY CLIP MISSING"; "TRAY CLIP MISSING" | Out-File diag.txt -Append }
          $stl = "$env:LOCALAPPDATA\Savor\selftest.log"
          if (Test-Path $stl) { Get-Content $stl | ForEach-Object { Write-Host "::notice::tray log: $_" }; Get-Content $stl | Out-File diag.txt -Append; Remove-Item $stl }
          $env:SAVOR_SELFTEST_TRAY = $null
          Stop-Process -Id $p.Id -Force
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3

          # third run: open a generated test clip in the built-in editor
          $ff = Get-ChildItem "$env:LOCALAPPDATA\Savor\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $clip = "$env:USERPROFILE\Videos\Savor\Clip test.mp4"
          New-Item -ItemType Directory -Force (Split-Path $clip) | Out-Null
          # 3 named audio tracks, like a Savor capture with separate tracks
          & $ff.FullName -v error -y -f lavfi -i testsrc2=size=1920x1080:rate=60 -f lavfi -i sine=440 -f lavfi -i sine=660 -f lavfi -i sine=880 -t 12 -map 0 -map 1 -map 2 -map 3 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac -metadata:s:a:0 handler_name=Mix -metadata:s:a:1 "handler_name=Desktop audio" -metadata:s:a:2 handler_name=Discord $clip
          $env:SAVOR_SELFTEST = "1"
          $p = Start-Process publish/Savor.exe -ArgumentList "--edit", "`"$clip`"" -PassThru
          Start-Sleep 70
          $p.Refresh()
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $line3 = "Editor open: private working set $(Mb $pws) MB, private bytes $(Mb $p.PrivateMemorySize64) MB"
          Write-Host "::notice::$line3"
          $line3 | Out-File diag.txt -Append
          "clip exists: $(Test-Path $clip)" | Out-File diag.txt -Append
          $st = "$env:LOCALAPPDATA\Savor\selftest.log"
          if (Test-Path $st) { $t = Get-Content $st -Raw; Write-Host "::notice::Self-test: $t"; $t | Out-File diag.txt -Append }
          $log = "$env:LOCALAPPDATA\Savor\errors.log"
          if (Test-Path $log) { Get-Content $log | Out-File diag.txt -Append; Write-Host "::warning::errors.log present" }
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("editor.png", [System.Drawing.Imaging.ImageFormat]::Png)
          # close the editor with Esc and check the memory comes back
          Add-Type -AssemblyName Microsoft.VisualBasic
          try { [Microsoft.VisualBasic.Interaction]::AppActivate($p.Id) } catch { }
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
          Start-Sleep 12
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $line4 = "Editor closed: private working set $(Mb $pws) MB"
          Write-Host "::notice::$line4"
          $line4 | Out-File diag.txt -Append
          Stop-Process -Id $p.Id -Force
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          # color-range check: how does the built-in player show limited vs full range black/white?
          function Probe-Clip($name, $encArgs) {
            $c = "$env:USERPROFILE\Videos\Savor\$name.mp4"
            $a = @("-v","error","-y","-f","lavfi","-i","color=c=black:s=1920x1080:r=30,drawbox=x=960:y=0:w=960:h=1080:c=white:t=fill","-t","4") + $encArgs + @($c)
            & $ff.FullName @a
            $q = Start-Process publish/Savor.exe -ArgumentList "--edit", "`"$c`"" -PassThru
            Start-Sleep 18
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$name.png", [System.Drawing.Imaging.ImageFormat]::Png)
            $vals = foreach ($x in 60..640) { if ($x % 20 -eq 0) { $bmp.GetPixel($x, 350).R } }
            Stop-Process -Id $q.Id -Force
            Get-CimInstance Win32_Process -Filter "ParentProcessId=$($q.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
            Start-Sleep 2
            $l = "$name -> row R values: $($vals -join ',')"
            Write-Host "::notice::$l"; $l | Out-File diag.txt -Append
          }
          Probe-Clip "range-limited" @("-c:v","libx264","-pix_fmt","yuv420p","-color_range","tv","-colorspace","bt709","-color_primaries","bt709","-color_trc","bt709")
          Probe-Clip "range-full" @("-c:v","libx264","-pix_fmt","yuvj420p","-color_range","pc","-colorspace","bt709","-color_primaries","bt709","-color_trc","bt709")

          gh release view ci-diagnostics *> $null
          if ($LASTEXITCODE -ne 0) { gh release create ci-diagnostics --prerelease --latest=false --title "CI diagnostics" --notes "Automated smoke-test output. Not a Savor release." }
          gh release upload ci-diagnostics screenshot.png editor.png diag.txt --clobber

      # Every push to main publishes (or refreshes) the release for the version in Savor.csproj.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Savor ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: publish/Savor.exe
          make_latest: true
