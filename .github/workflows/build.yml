name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch FFmpeg (embedded into Savor.exe)
        shell: pwsh
        run: |
          # Pinned to the stable 7.1 branch so FFmpeg option changes can't break Savor unexpectedly.
          $base = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest"
          try { Invoke-WebRequest "$base/ffmpeg-n7.1-latest-win64-gpl-7.1.zip" -OutFile ffmpeg.zip }
          catch { Write-Warning "7.1 build not found, using master"; Invoke-WebRequest "$base/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $exe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          & $exe.FullName -hide_banner -version | Select-Object -First 1
          & $exe.FullName -hide_banner -filters | Select-String ddagrab
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $in = [IO.File]::OpenRead($exe.FullName)
          $out = [IO.File]::Create("ffmpeg/ffmpeg.exe.gz")
          $gz = New-Object IO.Compression.GZipStream($out, [IO.Compression.CompressionLevel]::Optimal)
          $in.CopyTo($gz); $gz.Dispose(); $out.Dispose(); $in.Dispose()
          Get-Item ffmpeg/ffmpeg.exe.gz | Select-Object Name, Length

      - name: Publish Savor.exe
        run: >
          dotnet publish src/Savor/Savor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Read version
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length
          $v = ([xml](Get-Content src/Savor/Savor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Savor
          path: publish/Savor.exe

      # Every push to main publishes (or refreshes) the release for the version in Savor.csproj.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Savor ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: publish/Savor.exe
          make_latest: true
