name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch FFmpeg (embedded into Savor.exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest stable release-branch build (e.g. n8.0) from BtbN, falling back to master.
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $stable = $assets | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-[\d.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+).*','$1') } -Descending
          $pick = if ($stable) { $stable[0] } else { "ffmpeg-master-latest-win64-gpl.zip" }
          Write-Host "::notice::FFmpeg build: $pick"
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $exe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $filters = (& $exe.FullName -hide_banner -filters) -join "`n"
          Write-Host "::notice::ddagrab=$($filters -match 'ddagrab') scale_d3d11=$($filters -match 'scale_d3d11')"
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $in = [IO.File]::OpenRead($exe.FullName)
          $out = [IO.File]::Create("ffmpeg/ffmpeg.exe.gz")
          $gz = New-Object IO.Compression.GZipStream($out, [IO.Compression.CompressionLevel]::Optimal)
          $in.CopyTo($gz); $gz.Dispose(); $out.Dispose(); $in.Dispose()

      - name: Publish Savor.exe
        run: >
          dotnet publish src/Savor/Savor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Read version
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length
          $v = ([xml](Get-Content src/Savor/Savor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Savor
          path: publish/Savor.exe

      # Every push to main publishes (or refreshes) the release for the version in Savor.csproj.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Savor ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: publish/Savor.exe
          make_latest: true
