name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Fetch FFmpeg (embedded into Savor.exe)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Newest stable release-branch build (e.g. n8.0) from BtbN, falling back to master.
          $assets = gh release view latest -R BtbN/FFmpeg-Builds --json assets --jq '.assets[].name'
          $stable = $assets | Where-Object { $_ -match '^ffmpeg-n(\d+)\.(\d+)-latest-win64-gpl-[\d.]+\.zip$' } |
            Sort-Object { [version]($_ -replace '^ffmpeg-n(\d+\.\d+).*','$1') } -Descending
          $pick = if ($stable) { $stable[0] } else { "ffmpeg-master-latest-win64-gpl.zip" }
          Write-Host "::notice::FFmpeg build: $pick"
          gh release download latest -R BtbN/FFmpeg-Builds -p $pick -O ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $exe = Get-ChildItem ffmpeg-dl -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $filters = (& $exe.FullName -hide_banner -filters) -join "`n"
          Write-Host "::notice::ddagrab=$($filters -match 'ddagrab') scale_d3d11=$($filters -match 'scale_d3d11')"
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          $in = [IO.File]::OpenRead($exe.FullName)
          $out = [IO.File]::Create("ffmpeg/ffmpeg.exe.gz")
          $gz = New-Object IO.Compression.GZipStream($out, [IO.Compression.CompressionLevel]::Optimal)
          $in.CopyTo($gz); $gz.Dispose(); $out.Dispose(); $in.Dispose()

      - name: Publish Savor.exe
        run: >
          dotnet publish src/Savor/Savor.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=false -p:DebugType=none -o publish

      - name: Read version
        shell: pwsh
        run: |
          Get-ChildItem publish | Select-Object Name, Length
          $v = ([xml](Get-Content src/Savor/Savor.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Savor
          path: publish/Savor.exe

      # Launches the built exe on the runner, records its memory use and a screenshot.
      # Results go to the "ci-diagnostics" pre-release (not shown as an update to users).
      - name: Smoke test (memory + screenshot)
        if: github.event_name == 'push'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $p = Start-Process publish/Savor.exe -PassThru
          Start-Sleep 40
          $p.Refresh()
          function Mb($b) { [math]::Round($b / 1MB, 1) }
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $kids = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)"
          $kidTxt = ($kids | ForEach-Object { "$($_.Name) $(Mb $_.WorkingSetSize)MB" }) -join ", "
          $line = "Savor: private working set $(Mb $pws) MB, working set $(Mb $p.WorkingSet64) MB, private bytes $(Mb $p.PrivateMemorySize64) MB | children: $kidTxt"
          Write-Host "::notice::$line"
          $line | Out-File diag.txt
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("screenshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Stop-Process -Id $p.Id -Force
          $kids | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3

          # second run: started in the tray (how it sits while gaming), replay buffer on
          $p = Start-Process publish/Savor.exe -ArgumentList "--minimized" -PassThru
          Start-Sleep 30
          $p.Refresh()
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $kids = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)"
          $kidTxt = ($kids | ForEach-Object { "$($_.Name) $(Mb $_.WorkingSetSize)MB" }) -join ", "
          $line2 = "In tray: private working set $(Mb $pws) MB, private bytes $(Mb $p.PrivateMemorySize64) MB | children: $kidTxt"
          Write-Host "::notice::$line2"
          $line2 | Out-File diag.txt -Append
          Stop-Process -Id $p.Id -Force
          $kids | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3

          # third run: open a generated test clip in the built-in editor
          $ff = Get-ChildItem "$env:LOCALAPPDATA\Savor\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $clip = "$env:USERPROFILE\Videos\Savor\Clip test.mp4"
          New-Item -ItemType Directory -Force (Split-Path $clip) | Out-Null
          & $ff.FullName -v error -y -f lavfi -i testsrc2=size=1920x1080:rate=60 -f lavfi -i sine=440 -t 12 -c:v libx264 -preset veryfast -pix_fmt yuv420p -c:a aac $clip
          $p = Start-Process publish/Savor.exe -ArgumentList "--edit", "`"$clip`"" -PassThru
          Start-Sleep 25
          $p.Refresh()
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $line3 = "Editor open: private working set $(Mb $pws) MB, private bytes $(Mb $p.PrivateMemorySize64) MB"
          Write-Host "::notice::$line3"
          $line3 | Out-File diag.txt -Append
          "clip exists: $(Test-Path $clip)" | Out-File diag.txt -Append
          $log = "$env:LOCALAPPDATA\Savor\errors.log"
          if (Test-Path $log) { Get-Content $log | Out-File diag.txt -Append; Write-Host "::warning::errors.log present" }
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("editor.png", [System.Drawing.Imaging.ImageFormat]::Png)
          # close the editor with Esc and check the memory comes back
          Add-Type -AssemblyName Microsoft.VisualBasic
          try { [Microsoft.VisualBasic.Interaction]::AppActivate($p.Id) } catch { }
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}")
          Start-Sleep 12
          $pws = (Get-CimInstance Win32_PerfFormattedData_PerfProc_Process -Filter "IDProcess=$($p.Id)").WorkingSetPrivate
          $line4 = "Editor closed: private working set $(Mb $pws) MB"
          Write-Host "::notice::$line4"
          $line4 | Out-File diag.txt -Append
          Stop-Process -Id $p.Id -Force
          Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          gh release view ci-diagnostics *> $null
          if ($LASTEXITCODE -ne 0) { gh release create ci-diagnostics --prerelease --latest=false --title "CI diagnostics" --notes "Automated smoke-test output. Not a Savor release." }
          gh release upload ci-diagnostics screenshot.png editor.png diag.txt --clobber

      # Every push to main publishes (or refreshes) the release for the version in Savor.csproj.
      - name: Publish release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Savor ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: publish/Savor.exe
          make_latest: true
